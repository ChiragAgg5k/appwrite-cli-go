name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

      # The keyring falls back to prefs.json where no secret store is
      # reachable, which is the path CI and headless Linux actually take.
      # Running the suite on all three platforms is what makes that claim
      # about Windows something other than an assumption.
      - name: Smoke test
        run: go run . --version
